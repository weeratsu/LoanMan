<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>LoanMan · Login sync</title><link rel="icon" href="assets/icon.svg"><link rel="stylesheet" href="css/style.css"></head><body>
<header><h1>💰 LoanMan</h1></header><main><div class="card" style="max-width:460px;margin:60px auto">
<h3>🔐 เชื่อมต่อ Google Sheet</h3><p class="muted">บน PC: Setup → Google Sheet Sync → 📋 คัดลอกรหัสเชื่อมต่อ แล้ววางที่นี่ (ทำครั้งเดียวต่อ browser)</p>
<textarea id="code" style="width:100%;height:110px;font-family:monospace;font-size:12px"></textarea>
<p><button class="btn" onclick="go()">เชื่อมต่อ</button> <a class="btn g" href="index.html">กลับ</a></p><p id="msg" class="muted"></p></div></main>
<script>
async function go(){var m=document.getElementById('msg');try{var c=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('code').value.trim()))));
 if(!/^https:/.test(c.endpoint||'')||!c.writeToken)throw new Error('รหัสไม่ถูกต้อง');m.textContent='กำลังทดสอบ…';
 var r=JSON.parse(await (await fetch(c.endpoint+'?token='+encodeURIComponent(c.readToken)+'&t='+Date.now())).text());
 if(!r.ok)throw new Error(r.error||'เชื่อมต่อไม่ได้');localStorage.setItem('lm_sheet_cfg',JSON.stringify(c));m.textContent='✓ เชื่อมต่อแล้ว';setTimeout(function(){location.href='index.html'},600);
}catch(e){m.textContent='⚠ '+(e.message||e);}}
</script></body></html>
